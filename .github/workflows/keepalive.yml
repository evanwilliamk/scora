name: keepalive

# Keeps the free-tier services warm: one daily request wakes Railway (by
# serving it) and generates Supabase activity (the endpoint runs a trivial
# query), so neither pauses after 7 idle days.

on:
  schedule:
    # Daily at 12:17 UTC. Off the top of the hour on purpose — GitHub delays
    # cron jobs scheduled at :00 due to load.
    - cron: "17 12 * * *"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway + Supabase
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 \
            https://zonal-prosperity-production-3965.up.railway.app/api/keepalive
